# QA-001: verificări automate la fiecare PR și la fiecare push pe main.
# Nu face deploy (Vercel publică separat); doar raportează dacă schimbarea e sigură de unit.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: puii-mei

jobs:
  checks:
    name: Lint, TypeScript, teste, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: puii-mei/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: TypeScript
        run: npm run typecheck
      - name: Teste unitare
        run: npm test
      - name: Build
        run: npm run build

  e2e:
    name: E2E (Playwright + PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: puii_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Valori doar pentru testare (bază locală, efemeră); niciun secret real.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/puii_e2e
      ADMIN_USER: admin@ci.test
      ADMIN_PASSWORD: ci-parola-de-test-1234
      PORT: "3005"
      BASE_URL: http://localhost:3005
      # Stocarea fișierelor: server S3 de test (e2e/fake-s3.mjs, verifică semnătura SigV4); chei doar de test.
      FILES_S3_ENDPOINT: http://127.0.0.1:9100
      FILES_S3_BUCKET: puii-mei-test
      FILES_S3_ACCESS_KEY_ID: ci-test-id
      FILES_S3_SECRET_ACCESS_KEY: ci-test-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: puii-mei/package-lock.json
      - run: npm ci
      - name: Browser Playwright
        run: npx playwright install --with-deps chromium
      - name: Build
        run: npm run build
      - name: Pornește stocarea S3 de test
        run: |
          nohup node e2e/fake-s3.mjs > fake-s3.log 2>&1 &
          for i in $(seq 1 20); do curl -sf http://127.0.0.1:9100/__debug/list > /dev/null && exit 0; sleep 0.5; done
          echo "Stocarea de test nu a pornit"; cat fake-s3.log; exit 1
      - name: Pornește serverul
        run: |
          export SESSION_SECRET="$(openssl rand -hex 32)"
          nohup npm start > server.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://localhost:3005/ > /dev/null && exit 0; sleep 1; done
          echo "Serverul nu a pornit"; cat server.log; exit 1
      - name: Teste E2E
        run: npx playwright test
      - name: Logurile serverului
        if: failure()
        run: cat server.log
      - name: Raportul Playwright
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: puii-mei/playwright-report
          retention-days: 7
